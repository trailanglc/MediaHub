name: Docs lint

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-lint.yml"

jobs:
  openapi:
    name: lint openapi.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Redocly lint
        run: npx --yes @redocly/cli@1 lint docs/api/openapi.yaml
