# Example nginx reverse proxy in front of MediaHub API (Gin).
# Set TRUSTED_PROXIES to the nginx container/host IP so ClientIP and rate limits are correct.

upstream mediahub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 0;

    location / {
        proxy_pass http://mediahub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Optional: scrape Prometheus from API /metrics (restrict by firewall or auth)
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://mediahub_api/metrics;
    }
}

# backend/.env:
# TRUSTED_PROXIES=127.0.0.1,::1,<nginx-ip>
# APP_ENV=production
# APP_URL=https://app.example.com
# API_PUBLIC_URL=https://api.example.com
