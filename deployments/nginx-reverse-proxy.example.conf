# Example nginx reverse proxy in front of MediaHub API (Gin) + MinIO, tuned for HLS at scale.
#
# Goal: serve HLS segments (.ts/.m4s) with the lowest latency and the highest concurrency by
#   1) letting the API authorize a request cheaply (shared HMAC signature, no DB/Redis/cookie), then
#   2) handing byte delivery to nginx via X-Accel-Redirect so the API never streams segment bytes, and
#   3) putting Cloudflare in front so each shared signed segment URL is cached once at the edge
#      and fanned out to every viewer (origin serves each segment at most once per cache TTL).
#
# Backend env to enable the X-Accel handoff (must match `internal` location below):
#   STREAM_INTERNAL_REDIRECT_PREFIX=/minio-hls
#
# If you do NOT set STREAM_INTERNAL_REDIRECT_PREFIX, the API streams segments itself and you can
# drop the `/minio-hls/` location; everything else still works.

upstream mediahub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# MinIO (or any S3-compatible store). Point at your object storage endpoint.
upstream mediahub_minio {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Cache MinIO responses on the origin too (second line of defense behind Cloudflare).
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:50m
                 max_size=20g inactive=7d use_temp_path=off;

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 0;

    # Efficient large-file delivery from disk cache / MinIO.
    sendfile on;
    tcp_nopush on;
    aio threads;

    # ---- HLS segments: API authorizes, nginx delivers bytes (internal redirect target) ----
    # The API responds with `X-Accel-Redirect: /minio-hls/<object-key>`. This location is not
    # reachable directly by clients (`internal`); only the API can trigger it.
    location /minio-hls/ {
        internal;

        # Strip the /minio-hls/ prefix and forward the object key to MinIO.
        # Replace `mediahub` with your bucket name.
        proxy_pass http://mediahub_minio/mediahub/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Origin-side cache so a Cloudflare miss does not always hit MinIO.
        proxy_cache hls_cache;
        proxy_cache_valid 200 206 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_buffering on;

        # Preserve the immutable cache headers the API set; segments never change.
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- Everything else (playlists, JSON API, signed-segment auth) -> Go API ----
    location / {
        proxy_pass http://mediahub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Optional: scrape Prometheus from API /metrics (restrict by firewall or auth)
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://mediahub_api/metrics;
    }
}

# backend/.env:
# TRUSTED_PROXIES=127.0.0.1,::1,<nginx-ip>
# APP_ENV=production
# APP_URL=https://app.example.com
# API_PUBLIC_URL=https://api.example.com
# STREAM_INTERNAL_REDIRECT_PREFIX=/minio-hls
#
# ----------------------------------------------------------------------------------------------
# Cloudflare in front of nginx
# ----------------------------------------------------------------------------------------------
# Two equivalent ways to expose nginx; pick one:
#
#  (A) Cloudflare Tunnel (recommended for a single self-hosted box): no open inbound ports, TLS
#      terminated by Cloudflare. Run cloudflared on the host and route the hostname to
#      http://127.0.0.1:443 (or 8080 if you skip nginx TLS). nginx still does the X-Accel handoff
#      and origin caching; the Tunnel just carries traffic. Tunnel + nginx are complementary.
#
#  (B) Public DNS + firewall: expose 443 and proxy through Cloudflare (orange cloud).
#
# Cloudflare Cache Rules (Rules -> Cache Rules), evaluated top to bottom:
#   1) If URI path matches "/stream/*" and ends with ".ts" or ".m4s":
#         - Cache eligibility: Eligible for cache
#         - Edge TTL: Override -> 1 day (>= STREAM_SEGMENT_URL_TTL is fine; URLs rotate per window)
#         - Cache key: Ignore query string is OFF (the ?e=&s= signature MUST be part of the key),
#           and Ignore cookies / do not vary by cookie (segments are cookie-free already).
#   2) If URI path matches "/stream/*" and ends with ".m3u8":
#         - Cache eligibility: Bypass cache (playlists are short-lived and per-session authorized;
#           the API already sends `Cache-Control: private, max-age=60` + ETag for browser revalidation).
#
# Result: the first viewer of each segment fills the edge cache; all subsequent viewers (any
# device, any network) are served from the nearest Cloudflare PoP without touching the origin.
